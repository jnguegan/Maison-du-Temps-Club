<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maison du Temps Club</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --black:#050505;
      --gold:#C6A75E;
      --white:#F5F5F5;
      --muted:#999;
    }

    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--black);
      color: var(--white);
    }

    header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:20px 7%;
    }

    .logo {
      height:28px;
    }

    .hero {
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:20px;
      background:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
        url("assets/hero-watch.jpg") center/cover no-repeat;
    }

    .hero img {
      max-width:420px;
      margin-bottom:20px;
    }

    .hero p {
      color:var(--muted);
      margin-bottom:30px;
    }

    .btn {
      padding:14px 26px;
      background:var(--gold);
      color:#000;
      text-transform:uppercase;
      letter-spacing:2px;
      border:none;
      cursor:pointer;
    }

    section {
      padding:80px 7%;
      text-align:center;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
      margin-top:40px;
    }

    .card img {
      width:100%;
      height:280px;
      object-fit:cover;
    }

    form {
      max-width:600px;
      margin:40px auto;
      text-align:left;
    }

    .field {
      margin-bottom:15px;
    }

    input, select, textarea {
      width:100%;
      padding:12px;
      background:#111;
      border:1px solid #333;
      color:#fff;
    }

    footer {
      text-align:center;
      padding:30px;
      font-size:12px;
      color:#666;
    }

    @media(max-width:768px){
      .grid {grid-template-columns:1fr;}
    }
  </style>
</head>

<body>

<header>
  <img src="assets/logo-main.png" class="logo">
</header>

<!-- HERO -->
<section class="hero">
  <div>
    <img src="assets/logo-light.png" alt="Maison du Temps Club">
    <p>Private Watch Sourcing for Elite Clients</p>
    <a href="#form"><button class="btn">Request Access</button></a>
  </div>
</section>

<!-- FEATURE WATCHES -->
<section>
  <h2>Selected Pieces</h2>

  <div class="grid">
    <div class="card"><img src="assets/watch-feature-1.jpg"></div>
    <div class="card"><img src="assets/watch-feature-2.jpg"></div>
    <div class="card"><img src="assets/watch-feature-3.jpg"></div>
  </div>
</section>

<!-- DETAIL SECTION -->
<section style="background:
  linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)),
  url('assets/watch-detail-1.jpg') center/cover no-repeat;">
  
  <h2>Discreet. Verified. Exclusive.</h2>
  <p style="max-width:600px;margin:20px auto;color:#aaa;">
    We source rare and investment-grade timepieces through a trusted global network.
  </p>
</section>

<!-- FORM -->
<section id="form">
  <h2>Request Access</h2>

  <form action="https://formsubmit.co/YOUR-EMAIL-HERE" method="POST">

    <div class="field">
      <input type="text" name="name" placeholder="Full Name" required>
    </div>

    <div class="field">
      <input type="email" name="email" placeholder="Email" required>
    </div>

    <div class="field">
      <input type="text" name="whatsapp" placeholder="WhatsApp">
    </div>

    <!-- BRAND DROPDOWN -->
    <div class="field">
      <select name="brand" required>
        <option value="">Select Brand</option>
        <option>Rolex</option>
        <option>Patek Philippe</option>
        <option>Audemars Piguet</option>
        <option>Richard Mille</option>
        <option>Hublot</option>
        <option>Cartier</option>
        <option>Vacheron Constantin</option>
        <option>Other</option>
      </select>
    </div>

    <div class="field">
      <input type="text" name="model" placeholder="Model (Daytona, Nautilus...)">
    </div>

    <div class="field">
      <select name="budget">
        <option value="">Budget Range</option>
        <option>€10k - €25k</option>
        <option>€25k - €50k</option>
        <option>€50k - €100k</option>
        <option>€100k+</option>
      </select>
    </div>

    <div class="field">
      <textarea name="message" placeholder="Additional details"></textarea>
    </div>

    <button class="btn" type="submit">Submit Request</button>

  </form>
</section>

<footer>
  Maison du Temps Club — Operated by Global Management Consultancy Limited
</footer>

</body>
</html>
